
{% block head %} <title>Home</title> {% endblock %}

{% block body %} 

  <div class="content">

    <h1>TODO - Flask</h1>

    {% if tasks|length < 1 %}
      <h3>There are no tasks</h3>
    {% else %}
    <table>
      <tr>
        <td>Task</td>
        <td>Completed</td>
        <td>Added</td>
        <td>Actions</td>
      </tr>
      {% for task in tasks %}
      <tr>
        <td>{{ task.content }}</td>
        <td>{{ task.completed }}</td>
        <td>{{ task.created_at }}</td>
        <td>
          <a href="#">Update</a>
          <a href="#">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}

    <form action="/" method="post">
      <input type="text" name="content" id="content">
      <input type="submit" value="Add Task">
    </form>

  </div>

{% endblock %}
