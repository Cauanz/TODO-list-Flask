{% extends 'base.html' %} {% block head %} <title>Update</title> {% endblock %}
{% block body %}

<div class="content">
  <h1>Update Task</h1>

  <form action="/update/{{task.id}}" method="post" class="form">
    <input type="text" name="content" id="content" value="{{task.content}}" />
    <input type="checkbox" name="completed" id="completed" value="{{task.completed}}"/>
    <input type="submit" value="Update Task" />
  </form>
</div>

{% endblock %}
